global:
  scrape_interval: 15s

scrape_configs:
  # HTTP-level service metrics (request counts/latencies) from
  # prometheus-fastapi-instrumentator, wired in app/main.py.
  - job_name: url-shortener-http
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Orchestrator reliability metrics (Section 8 of the plan), computed
  # fresh from the audit log on every scrape by app/routers/observability.py.
  - job_name: url-shortener-orchestrator
    metrics_path: /orchestrator/metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

[project]
name = "agentic-url-shortener"
version = "0.1.0"
description = "Production-grade URL Shortener + LangGraph agentic SDLC orchestrator"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.2",
    "anthropic>=0.40",
    "prometheus-fastapi-instrumentator>=7.0",
    "redis>=5.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "orchestrator*", "scenarios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in argument defaults is the documented,
# intended pattern, not the mutable-default-argument bug this rule targets.
# S110/BLE001: orchestrator agents deliberately catch-and-fall-back on any
# LLM failure mode (the plan's Section 3.4 Fallback control) rather than
# enumerate every possible SDK/network/parsing exception.
ignore = ["B008", "S110", "BLE001"]

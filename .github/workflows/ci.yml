name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest, with coverage)
        run: pytest --cov=app --cov=orchestrator --cov-report=term-missing
        env:
          # Mirrors what every test in this repo already assumes locally:
          # no live LLM key, so agents run in mock mode.
          ANTHROPIC_API_KEY: ""
